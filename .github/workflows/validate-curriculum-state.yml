name: Validate curriculum state

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  curriculum-state:
    name: Curriculum proposal state
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Test curriculum proposal state
        run: python scripts/test_curriculum_state.py

      - name: Validate curriculum proposal state
        run: python scripts/validate_curriculum_state.py
