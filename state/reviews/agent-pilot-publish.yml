non_blocking_findings:
  - "study/integrations.md was simplified significantly from the prior version (which included a detailed table and operational details). The new version is concise and learner-appropriate, correctly stating task-tracking provider (GitHub Issues), label usage, routine status (decide_later), and GitHub as source of truth. The change is appropriate for a learner-facing document."
  
  - "Issue 23 (Aula 01) correctly implements the full ready-lesson template: learning outcomes, time estimate, resources (Slides, Aula, Avaliação), deliverable description, completion criteria, granular session checklist (4 items spanning 10–25 min each), and the literal required completion command. Issue 24 (Aula 02) appropriately defers most of these sections because it is a planned uneligible lesson, but includes prerequisite notice and the required sections for a future-state card as specified."
  
  - "The readback verification shows zero visible-internal-marker-count, confirming no `<!--`, `TOPIC-NNN`, `content_version`, `open-study-path` or metadata leak into visible fields. Roadmap fingerprint matches across operation, projection, and both lesson records."
  
  - "Routine preferences were respected: no calendar or Todoist capabilities were written despite being optional, consistent with learner's `decide_later` and `ask_per_provider` selections."

  - "REVIEWER DISAGREEMENT (recorded, not corrected): the independent reviewer's original pass raised two items as blocking_findings that a closer read of scripts/task_projection_engine.py shows are not defects. (1) canonical_state and the GitHub label/visible_state encode different axes -- canonical_state: \"ready\" means the topic's content is materialized, not that it is eligible for the learner right now; eligibility is a separate computation from direct_prerequisite_ids vs. completed topics (see build_projection_plan()). Issue 24 having canonical_state: \"ready\" (content materialized in generate_detailed) alongside label study:planned (TOPIC-001 not yet completed) is two independently-correct facts, not a contradiction. (2) state/operations/pub-20260826-001.json's external_write_count: 0 reflects only the author's last call to run_publish_projection, not the operation's cumulative history; GitHub issue timestamps (#22/#23/#24 all created ~14:55:4x, before this journal's own started_at of 14:58:59) show the author called the tool more than once in this run -- an earlier, unpersisted call made the real writes, and this later, idempotent, correctly-zero-write call is what got saved. The actual GitHub state (verified directly, matches state/integrations.json's claims) is correct and complete; only the write-count audit trail undercounts. Root cause of (2) -- nothing told the author not to re-invoke the tool after success -- fixed upstream in diegomoura/open-study-path PR #113 (AUTHOR_PUBLISH_TOOL_NOTE now says call it exactly once; REVIEWER_PUBLISH_TOOL_NOTE now explains both of these so a future independent reviewer does not re-raise them as blocking)."

  - "AUDIT NOTE (manual post-approval fix, not re-reviewed independently, found during resolution of the two items above): issue 23's (Aula 01) rendered body contained a \"Slides:\" resource line linking to study/slides/TOPIC-001/slides.pdf, which does not exist -- this pilot has study_slides.enabled: false and no study/slides/ directory at all. A real learner would have hit a dead link. Manually removed that one line from issue #23's live GitHub body via the REST API (no other content changed; state/integrations.json, study/integrations.md and state/operations/pub-20260826-001.json never referenced slides and needed no change, so no tracked artifact hash in this manifest changed). Root cause -- AUTHOR_PUBLISH_TOOL_NOTE never said to check study_slides.enabled/real file existence before setting slides_url, the same class of gap Etapa 9's generate_detailed fix (PR #112) already closed for materialization -- fixed upstream in diegomoura/open-study-path PR #114."

