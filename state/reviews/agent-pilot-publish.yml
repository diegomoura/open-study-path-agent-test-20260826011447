blocking_findings:
  - "Issue 24 (Aula 02 · Os três grandes autores) is marked with label `study:planned` in GitHub, which correctly indicates an uneligible lesson whose prerequisites are not yet met. However, state/integrations.json records this issue with `canonical_state: ready` instead of `canonical_state: planned`. According to the task-projection-engine contract, canonical_state must be one of: 'planned' (content not ready or prerequisites unmet), 'ready' (content ready and eligible), 'in_progress', 'in_assessment', 'review_required', or 'completed'. The label-to-state mismatch indicates either (a) the issue should be unpublished until TOPIC-001 is mastered (correct by contract), or (b) the canonical_state record should be 'planned' to match the GitHub label. As recorded, the state is contradictory and would fail the task_projection_engine validator's round-trip consistency check."
  
  - "state/operations/pub-20260826-001.json records `external_write_count: 0` but the operation created three new GitHub Issues (project reference #22, orientation #22, lesson #23, lesson #24). The write count must match the actual resources created. This discrepancy indicates either incomplete operation journaling or a mismatch between what was recorded as created and what appears in state/integrations.json. The operation journal must be corrected to reflect `external_write_count: 3` for accurate recovery and idempotency verification."

