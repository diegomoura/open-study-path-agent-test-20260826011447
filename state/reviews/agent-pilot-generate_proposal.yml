  - "Scope, starting point and rationale are grounded in the approved intake (three Roman authors, dichotomy of control, reflective journal, primary texts over summaries) and the diagnostic (complete beginner who already holds a correct informal intuition of the dichotomy of control); the roadmap correctly contextualizes and formalizes that intuition rather than re-teaching it, and the scope section is honest about the introductory boundary (excludes deep Stoic logic/physics and Greek Stoics beyond needed context)."
  - "No integrations.md, state/integrations.json or external resources were created or changed in this proposal, consistent with the topic-first safe-publication contract; instance markers were set atomically (curriculum_proposed: true, curriculum_approved: true, curriculum_generated: false). Both changed generated artifacts are covered here with verified current SHA-256 fingerprints."
  - "Learner-facing prose is pt-BR, uses 'aula futura'/'pronta' rather than internal materialized/planned terminology, defines vocabulary at first occurrence, and explains that lesson numbering aids navigation while direct prerequisites remain authoritative for readiness."