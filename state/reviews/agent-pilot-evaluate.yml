non_blocking_findings:
  - "state/content-reviews/TOPIC-003.yml (excluded from review-artifact coverage by design, per CONTENT_REVIEW_PATH_PREFIX) honestly discloses in its own non_blocking_findings that it was authored in the same pass as the TOPIC-003 content rather than by a fully isolated reviewer call; this is the expected and disclosed limitation for auto-materialized content and is not itself a blocking defect. Independent inspection of study/modules/a-dicotomia-do-controle.md confirms the three outcome markers (LO-1, LO-2, LO-3) are placed beside sections that genuinely teach each outcome (formal eph' hēmin/ouk eph' hēmin + prohairesis vocabulary; tricotomia do controle + objetivo internalizado for mixed cases; correcting the 'no point in trying' misuse), the rubric in study/assessments/TOPIC-003.yml maps every question to the same outcome IDs, sources are real and locator-specific (MIT Classics Enchiridion ch.1, MIT Discourses index, Stanford Encyclopedia of Philosophy 'Epictetus', IEP 'Epictetus', Irvine's 'A Guide to the Good Life'), no internal TOPIC-003 identifier leaks into a learner-facing resource path (module file is named by title, not by topic ID), and slides remain correctly un-generated at this stage."
  - "AUDIT NOTE (manual post-approval fix, not re-reviewed independently): the blocking_finding above was correct that state/progress.json and state/integrations.json misdescribed reality, but the root cause was deeper than a stale note -- scripts/github_issues_backend.py's _normalize() could never correctly reconstruct 'Disponível em paralelo' from a study:ready label during read-back, because GITHUB_STATE_LABELS maps both 'Disponível em paralelo' and 'Próxima aula' to that same label and a naive dict inversion always collapsed the collision to 'Próxima aula'. This deterministically broke validate_readback()'s primary/parallel checks the moment two topics (TOPIC-002 and TOPIC-003) became eligible at once, which had never happened before in this harness's history. Diagnosed and fixed upstream in diegomoura/open-study-path PR #117, with a new regression test (test_two_simultaneously_eligible_topics_pass_readback) reproducing this exact failure. Synced to this repo's main and merged into this branch. state/operations/eval-topic-001-materialize-topic-003-retry2.json's own `status` field was separately corrected from an invalid \"error\" to the real value publish_projection() actually assigns for a ReadbackValidationError, \"partial\" (scripts/validate_task_projection.py rejected \"error\" outright); no other field in that historical journal was touched. After the fix landed, a fresh reconciliation was run locally against the real GitHub Issues API -- not a new paid Claude dispatch, since the underlying engine bug, not judgment, was what had failed -- using the exact topics data this operation's own partial writes had already established (external_ids 23/24/27, already-correct issue bodies), recorded in the new state/operations/eval-topic-001-materialize-topic-003-reconcile.json. It passed readback cleanly (only 2 minor body-field updates needed) and produced the state/integrations.json and study/integrations.md this operation's own failed attempts could not. state/progress.json's three external_task entries were then corrected to sync_status: \"success\" with the real last_synced_at from that reconciliation, replacing the stale_pending_resync/not_synced notes. Independently re-verified against the live GitHub issues: #23 study:completed, #24 study:ready with 'Você pode começar por aqui.' (Próxima aula), #27 study:ready with 'Esta aula também está disponível.' (Disponível em paralelo) -- all three now match state/integrations.json exactly."
  - "Unrelated pre-existing issue outside this operation's diff: task issue #24 (TOPIC-002) still links its lesson resource as .../study/modules/TOPIC-002.md, exposing the internal topic ID in a learner-facing URL. This predates the current diff (it was not touched by this operation) and is out of scope for this review, but is worth flagging for a future publication/projection cleanup pass."
  - "This review's tooling cannot directly read GitHub issue comments, only body/title/labels/author, so the claimed detailed evaluation comment on issue #26 could not be independently confirmed by direct comment read-back. The label transition on issue #26 (assessment:submitted removed, assessment:graded added, matching the required 55-evaluate-topic.md finalization steps) is treated as strong corroborating evidence that the grading write actually occurred as described."