  - "progress_update: state/progress.json's external_task entry for TOPIC-001 (issue #23) reads sync_status='stale_pending_resync' with the note \"the authoritative task card still needs to be moved to 'Concluído' by a follow-up publish/sync run because run_publish_projection returned a readback validation error.\" A direct, harmless read-back of the real issue #23 shows it already carries label 'study:completed' and body 'Aula concluída com evidência durável registrada no GitHub.' — i.e. the authoritative task has, in fact, already been moved to the completed state (most likely by the partial external writes the operation's own journal admits occurred, external_write_count=3, before a later readback check failed for unrelated reasons: roadmap/lesson-count and TOPIC-002/TOPIC-003 primary/parallel projection). The persisted state therefore misdescribes verified external reality: it reports an unresolved pending-sync condition for a task that is not actually pending. state/integrations.json is correspondingly stale (still records issue #23 canonical_state='ready'/visible_state='Próxima aula' from the prior 2026-08-28T14:58:59 publish, not the operation's later partial write). This is exactly the class of state/reality contradiction instructions/04-review-generated-artifacts.md and the publication/progress contracts require reviewers to catch: a subsequent track or publish run relying on this note could attempt a redundant or conflicting resync of an already-synced resource, or route the learner's next action incorrectly, because the durable record does not match the GitHub source of truth. This must be corrected (re-verify issue #23/#24 real state via read-back and rewrite the progress.json/integrations.json notes and sync_status fields to match reality, or genuinely roll back/reconcile the partial write) before this operation can be approved."

